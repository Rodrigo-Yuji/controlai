<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#2459e0"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="ControlAI"/><link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png"/><link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png"/><title>ControlAI — Finanças</title><style>body{margin:0}.startup-screen{width:100%;max-width:none;margin:0;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;background:radial-gradient(ellipse at 50% 42%,#e7f7f2 0,transparent 52%),#f6f8fc;color:#102c4e}.startup-screen h1{margin:10px 0 0;font:750 30px/1.2 system-ui;letter-spacing:-1px}.startup-screen p{margin:0;font:14px/1.5 system-ui;color:#61768a}.startup-emblem{position:relative;display:grid;place-items:center;width:116px;height:116px}.startup-emblem img{position:relative;object-fit:contain;border-radius:22px;box-shadow:0 12px 32px #0a716e18;animation:startup-reveal .45s ease-out both}.startup-orbit{position:absolute;inset:0;border:1px solid #0ba88820;border-top:2px solid #0aa886;border-radius:36px;animation:startup-spin 2.2s linear infinite}.startup-loader{width:44px;height:3px;margin-top:16px;border-radius:4px;background:linear-gradient(90deg,transparent,#0aa886,transparent);background-size:200% 100%;animation:startup-flow 1.1s ease-in-out infinite}@keyframes startup-spin{to{transform:rotate(360deg)}}@keyframes startup-reveal{from{opacity:0;transform:translateY(5px) scale(.95)}to{opacity:1;transform:none}}@keyframes startup-flow{from{background-position:150% 0}to{background-position:-50% 0}}@media(prefers-color-scheme:dark){.startup-screen{background:radial-gradient(ellipse at 50% 42%,#12372f 0,transparent 52%),#0d1726;color:#eef8ff}.startup-screen p{color:#a7b9c9}}@media(prefers-reduced-motion:reduce){.startup-screen *{animation:none!important}}</style></head><body><div id="root"><main class="startup-screen" role="status" aria-label="Abrindo ControlAI"><div class="startup-emblem"><span class="startup-orbit"></span><img src="./icons/brand-mark.png" width="88" height="88" alt=""/></div><h1>ControlAI</h1><p>Seu dinheiro, suas regras</p><span class="startup-loader" aria-hidden="true"></span></main></div><script type="module" src="/src/main.tsx"></script></body></html>
