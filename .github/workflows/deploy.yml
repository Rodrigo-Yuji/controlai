name: Publicar ControlAI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cancel_deployment:
        description: 'SHA ou ID de uma publicação do Pages travada (opcional)'
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Recover the orphaned deployment once; later incidents can use the manual input.
      - name: Cancelar publicação antiga travada
        if: inputs.cancel_deployment || (github.event_name == 'push' && github.event.before == '2f1abfd6c906c879a22a31f6f0c268799ca2dbc9' && github.run_attempt == 1)
        uses: actions/github-script@v8
        env:
          PAGES_DEPLOYMENT_TO_CANCEL: ${{ inputs.cancel_deployment || 'f0bcd7115e2601e42802bc05ea2625866fcfa26f' }}
        with:
          script: |
            let deploymentId = process.env.PAGES_DEPLOYMENT_TO_CANCEL;
            if (!/^(?:[a-f0-9]{40}|[0-9]+)$/i.test(deploymentId)) {
              throw new Error('Informe um SHA completo ou ID numérico de publicação.');
            }
            const parameters = {...context.repo, deploymentId};
            try {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', parameters);
              core.notice(`Publicação anterior ${deploymentId}: ${data.status}`);
              const terminal = ['succeed', 'deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_lost'];
              if (terminal.includes(data.status)) return;
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', parameters);
              core.notice(`Cancelamento solicitado para ${deploymentId}.`);
            } catch (error) {
              if (error.status === 404) throw new Error(`A API não encontrou o ID ${deploymentId}; confirme o ID antes de tentar publicar.`);
              throw error;
            }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
